# Laboratorio AMQP MITM — ataque y defensa (SOLO USO EDUCATIVO / LABORATORIO AISLADO)
#
# Levantar:   docker compose up --build
# Apagar:     docker compose down
# Limpiar:    docker compose down -v --rmi all
#
# Las credenciales y parámetros vienen de .env (ver .env.example).

services:
  # ---------------------------------------------------------------
  #  Broker RabbitMQ (la "víctima" central)
  # ---------------------------------------------------------------
  rabbit:
    image: rabbitmq:4-management
    container_name: amqp
    hostname: rabbit
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # UI de gestión (http://localhost:15672)
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - red_docker

  # ---------------------------------------------------------------
  #  Productor: publica mensajes AMQP en la cola
  # ---------------------------------------------------------------
  el_enviador:
    build: ./el_enviador
    container_name: insaneador
    depends_on:
      rabbit:
        condition: service_healthy
    environment:
      AMQP_HOST: ${AMQP_HOST}
      AMQP_PORT: ${AMQP_PORT}
      AMQP_QUEUE: ${AMQP_QUEUE}
      AMQP_USER: ${RABBITMQ_USER}
      AMQP_PASS: ${RABBITMQ_PASS}
    networks:
      red_docker:
        aliases:
          - el_enviador
    restart: unless-stopped

  # ---------------------------------------------------------------
  #  Consumidor: recibe los mensajes (y evidencia la manipulación)
  # ---------------------------------------------------------------
  el_espameado:
    build: ./el_espameado
    container_name: insaneado
    depends_on:
      rabbit:
        condition: service_healthy
    environment:
      AMQP_HOST: ${AMQP_HOST}
      AMQP_PORT: ${AMQP_PORT}
      AMQP_QUEUE: ${AMQP_QUEUE}
      AMQP_USER: ${RABBITMQ_USER}
      AMQP_PASS: ${RABBITMQ_PASS}
    networks:
      red_docker:
        aliases:
          - el_espameado
    restart: unless-stopped

  # ---------------------------------------------------------------
  #  Atacante MITM: ARP spoofing + intercepta/modifica frames AMQP
  #  Principio de mínimo privilegio: solo las capacidades de red
  #  necesarias (NET_ADMIN, NET_RAW), sin `privileged: true`.
  # ---------------------------------------------------------------
  el_sniffer:
    build: ./el_sniffer
    container_name: sniffermitm
    depends_on:
      rabbit:
        condition: service_healthy
      el_enviador:
        condition: service_started
      el_espameado:
        condition: service_started
    environment:
      MITM_TARGET_A: ${MITM_TARGET_A}
      MITM_TARGET_B: ${MITM_TARGET_B}
      AMQP_PORT: ${AMQP_PORT}
      AMQP_HOST: ${AMQP_HOST}
      AMQP_QUEUE: ${AMQP_QUEUE}
      AMQP_USER: ${RABBITMQ_USER}   # para el replay (atacante publica en la cola)
      AMQP_PASS: ${RABBITMQ_PASS}
    ports:
      - "8080:8080"   # panel de control -> http://localhost:8080
    volumes:
      # Sirve el panel desde el disco: editar static/ y recargar, sin rebuild.
      - ./el_sniffer/static:/app/static:ro
    cap_add:
      - NET_ADMIN   # manipular ARP
      - NET_RAW     # sockets raw (scapy)
    networks:
      red_docker:
        aliases:
          - el_sniffer
    restart: unless-stopped

  # ---------------------------------------------------------------
  #  Defensor DPI: observa (pasivo) el tráfico del broker y alerta.
  #  Comparte el netns de 'rabbit' para VER todo el AMQP + ARP sin
  #  necesidad de ARP spoofing. Empuja las alertas al panel.
  # ---------------------------------------------------------------
  el_defensor:
    build: ./el_defensor
    container_name: dpi
    network_mode: "service:rabbit"   # comparte la red del broker
    depends_on:
      rabbit:
        condition: service_healthy
      el_sniffer:
        condition: service_started
    environment:
      AMQP_PORT: ${AMQP_PORT}
      DEFENSE_SINK: http://el_sniffer:8080/api/defense/alert
    cap_add:
      - NET_RAW     # sniff pasivo (scapy)
      - NET_ADMIN
    restart: unless-stopped

  # ---------------------------------------------------------------
  #  Suricata: IDS de industria. Comparte el netns del broker,
  #  aplica reglas de firma propias y reenvía sus alertas al panel.
  # ---------------------------------------------------------------
  suricata:
    build: ./suricata
    container_name: suricata
    network_mode: "service:rabbit"   # comparte la red del broker
    depends_on:
      rabbit:
        condition: service_healthy
      el_sniffer:
        condition: service_started
    environment:
      SURI_IFACE: eth0
      DEFENSE_SINK: http://el_sniffer:8080/api/defense/alert
    cap_add:
      - NET_RAW     # captura AF_PACKET
      - NET_ADMIN
    restart: unless-stopped

networks:
  red_docker:
    driver: bridge
